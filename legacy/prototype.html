<script>
const services=[['Corte de Cabelo','Precisão, estilo e acabamento impecável.',60,45,'✂'],['Barba','Ritual completo com toalha quente.',50,30,'♜'],['Visagismo Personalizado','Imagem alinhada ao seu estilo.',80,60,'◈'],['Corte + Barba','A experiência Bigode Grosso completa.',100,75,'✦'],['Designer de Sobrancelha','Harmonia e definição no olhar.',40,30,'⌁']];

const route=()=>location.hash.slice(1)||'/'; const go=p=>{location.hash=p;window.scrollTo(0,0)};const money=n=>'R$ '+n.toFixed(2).replace('.',',');

function publicHome(){return `${nav()}<main><section class="hero"><div><div class="eyebrow">Barbearia premium · Campo Novo do Parecis</div><h1>Seu estilo merece <em>presença.</em></h1><p>Visagismo Personalizado. Corte e Barba de Excelência. Designer de Sobrancelha. Um ritual de cuidado feito para a sua melhor versão.</p><div class="hero-actions"><button class="button" onclick="go('/agendamento')">AGENDAR ATENDIMENTO →</button><button class="button ghost" onclick="whats()">◉ FALAR NO WHATSAPP</button></div><div class="quick-info"><span>⌖ Campo Novo do Parecis — MT</span><span>◉ (65) 98408-4009</span></div></div><div class="owner-wrap"><img src="assets/dono-bigode-grosso.jpg" alt="Proprietário da Barbearia Bigode Grosso"><div class="owner-caption"><b>Bigode Grosso</b><span>Excelência em cada detalhe</span></div></div></section><section class="section dark"><div class="section-head"><div><div class="eyebrow">O seu momento</div><h2>Serviços com assinatura.</h2></div><a onclick="go('/servicos')" class="eyebrow" style="cursor:pointer">VER TODOS →</a></div><div class="cards">${services.slice(0,4).map((s,i)=>serviceCard(s,i)).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Quem vive, recomenda</div><h2>Mais do que um corte.</h2></div><p class="sub">Ambiente, técnica e atenção que fazem do atendimento uma experiência.</p></div><div class="test-grid">${[['“O visagismo mudou minha relação com a imagem. Atendimento impecável.”','Gustavo N.'],['“Ambiente elegante e profissionais que realmente entendem de estilo.”','Matheus R.'],['“Minha agenda fixa de cuidado. Consistência rara de encontrar.”','Leonardo S.']].map(q=>`<article class="card quote"><p>${q[0]}</p><small>★★★★★ · ${q[1]}</small></article>`).join('')}</div></section><section class="cta"><div><div class="eyebrow">Seu próximo nível começa aqui</div><h2>Reserve seu horário.</h2><p class="sub">Escolha seu serviço e profissional em menos de dois minutos.</p></div><button function servicesPage(){return `${nav()}<main class="page"><div class="eyebrow">A experiência Bigode Grosso</div><h1 class="page-title">Escolha o seu ritual.</h1><p class="sub">Técnica precisa, produtos selecionados e profissionais que respeitam a sua identidade.</p><div class="cards" style="margin-top:35px">${services.map((s,i)=>serviceCard(s,i)).join('')}</div></main>${footer()}`}

function booking(){let b=state.booking,s=b.service!==null?services[b.service]:null,p=b.pro!==null?pros[b.pro]:null;let title=['Escolha seu serviço','Escolha o profissional','Escolha dia e horário','Seus dados','Revise seu agendamento','Agendamento confirmado'][b.step-1];let content='';if(b.step===1)content=`<div class="choice-grid">${services.map((x,i)=>`<button class="choice ${b.service===i?'selected':''}" onclick="selectBook('service',${i})"><b>${x[0]} <span style="float:right;color:var(--gold2)">${money(x[2])}</span></b><small>${x[1]} · ${x[3]} min</small></button>`).join('')}</div>`;if(b.step===2)content=`<div class="choice-grid">${pros.map((x,i)=>`<button class="choice ${b.pro===i?'selected':''}" onclick="selectBook('pro',${i})"><div class="pro-top"><div class="avatar">${x.i}</div><span><b>${x.n}</b><small>${x.e}</small></span><span class="stars">★ ${x.r}</span></div></button>`).join('')}</div>`;if(b.step===3)content=`<div class="eyebrow">Setembro 2026</div><div class="calendar">${['D','S','T','Q','Q','S','S'].map(x=>`<div class="day meta">${x}</div>`).join('')}${Array.from({length:30},(_,i)=>`<div onclick="selectDate(${i+1})" class="day ${i>1&&i<27?'available':''} ${b.date===i+1?'selected':''}">${i+1}</div>`).join('')}</div><b style="font-size:13px">Horários disponíveis · ${b.date?'Dia '+b.date:'selecione uma data'}</b><div class="time-grid" style="margin-top:14px">${['08:00','09:00','10:30','11:30','13:00','14:00','15:30','16:30','17:30'].map(t=>`<button onclick="selectTime('${t}')" class="time ${b.time===t?'selected':''}">${t}</button>`).join('')}</div>`;if(b.step===4)content=`<div class="form-grid"><label class="field">NOME COMPLETO<input id="clientName" placeholder="Como podemos chamar você?"></label><label class="field">WHATSAPP<input placeholder="(65) 9 9999-9999"></label><label class="field">E-MAIL (OPCIONAL)<input placeholder="seu@email.com"></label><label class="field">OBSERVAÇÃO (OPCIONAL)<textarea placeholder="Alguma preferência?"></textarea></label></div>`;if(b.step===5)content=`<div class="next"><div class="eyebrow">Tudo certo?</div><h2>Seu momento está reservado.</h2><div class="info-list"><div><span>Estabelecimento</span><b>Barbearia Bigode Grosso</b></div><div><span>Serviço</span><b>${s[0]} · ${s[3]} min</b></div><div><span>Profissional</span><b>${p.n}</b></div><div><span>Data e horário</span><b>${b.date} de setembro · ${b.time}</b></div><div><span>Valor</span><b style="color:var(--gold2)">${money(s[2])}</b></div></div></div>`;if(b.step===6)content=`<div class="success"><div class="check">✓</div><div class="eyebrow">Agendamento confirmado</div><h2 style="font:500 35px 'Playfair Display'">Até breve.</h2><p class="sub" style="margin:auto auto 20px">Seu horário foi enviado para nossa agenda. Vamos cuidar de cada detalhe.</p><div class="code">BG-${String(Math.floor(1000+Math.random()*8999))}</div><div class="stack" style="justify-content:center"><button class="button ghost" onclick="toast('Evento adicionado ao calendário')">＋ ADICIONAR AO CALENDÁRIO</button><button class="button ghost" onclick="whats()">◉ WHATSAPP</button><button class="button" onclick="go('/minha-conta')">MINHA CONTA</button></div></div>`;return `${nav()}<main class="page booking"><div class="eyebrow">Agendamento online</div><h1 class="page-title">${title}</h1><p class="sub">${b.step<6?'Em poucos passos, você reserva o seu melhor horário.':'A Barbearia Bigode Grosso espera por você.'}</p><div class="steps">${['Serviço','Profissional','Data','Dados','Revisão'].map((x,i)=>`<div class="step ${b.step===i+1?'active':b.step>i+1?'done':''}"><i>${b.step>i+1?'✓':i+1}</i><span>${x}</span></div>`).join('')}</div><div class="card booking-box">${content}${b.step<6?`<div class="booking-controls"><button class="button ghost" ${b.step===1?'style="visibility:hidden"':''} onclick="bookPrev()">← VOLTAR</button><button class="button" onclick="bookNext()">${b.step===5?'CONFIRMAR AGENDAMENTO':'CONTINUAR →'}</button></div>`:''}</div></main>${footer()}`}

function adminNav(active){let links=[['/admin','▦','Dashboard'],['/admin/agenda','▣','Agenda'],['/admin/atendimentos','◷','Atendimentos'],['/admin/clientes','♙','Clientes'],['/admin/profissionais','♜','Profissionais'],['/admin/servicos','✦','Serviços'],['/admin/estoque','▤','Estoque'],['/admin/produtos','▱','Produtos'],['/admin/financeiro','◌','Financeiro'],['/admin/relatorios','▧','Relatórios'],['/admin/configuracoes','⚙','Configurações']];return `<aside class="admin-side"><div class="brand"><b>✦</b> BIGODE GROSSO</div><nav class="admin-nav">${links.map(l=>`<a onclick="go('${l[0]}')" class="${active===l[0]?'active':''}">${l[1]} &nbsp;${l[2]}</a>`).join('')}</nav><div class="admin-user"><div class="avatar" style="width:32px;height:32px;font-size:12px">AO</div><span>Auto Padrão<br><small class="meta">Proprietário</small></span></div></aside>`}function adminShell(path,body,title,sub='Visão geral da operação em tempo real'){return `<div class="admin-layout">${adminNav(path)}<main class="admin-main"><header class="admin-top"><div><h1 class="admin-title">${title}</h1><div class="admin-sub">${sub}</div></div><div class="stack" style="margin:0"><button class="icon-btn" onclick="toast('3 notificações pendentes')">♢ 3</button><button class="button" onclick="openNewAppointment()">＋ NOVO AGENDAMENTO</button></div></header><div class="admin-content">${body}</div></main></div>`}
function metrics(){return `<div class="metrics">${[['Agendamentos hoje','12','+3 confirmados'],['Faturamento do dia','R$ 1.240','+18% vs ontem'],['Faturamento do mês','R$ 18.450','+14% vs mês anterior'],['Clientes ativos','156','+12 novos este mês']].map(x=>`<article class="panel metric"><span>${x[0]}</span><b>${x[1]}</b><i class="up">↑ ${x[2]}</i></article>`).join('')}</div>`}function chart(){return `<div class="chart"><svg viewBox="0 0 500 210" preserveAspectRatio="none"><polyline fill="none" stroke="#d4ae61" stroke-width="3" points="0,185 35,150 75,161 115,127 150,139 190,110 225,118 270,78 310,95 355,60 400,72 450,31 500,18"/><polyline fill="none" stroke="#f2d69033" stroke-width="18" points="0,185 35,150 75,161 115,127 150,139 190,110 225,118 270,78 310,95 355,60 400,72 450,31 500,18"/></svg></div>`}
function dashboard(){let body=`${metrics()}<div class="admin-grid"><section class="panel agenda"><h3>Agenda — Hoje, 15 de setembro <span class="status" style="float:right">Visão semanal</span></h3><div class="agenda-head"><div>HORA</div>${pros.map(p=>`<div>● ${p.n.split(' ')[0]}</div>`).join('')}</div><div class="agenda-grid">${Array.from({length:10},(_,r)=>{let h=8+r;return `<div class="slot">${String(h).padStart(2,'0')}:00</div>${[0,1,2].map(c=>{let a=state.appointments.find((x,idx)=>r===idx+1&&((idx==0&&c==0)||(idx==1&&c==1)||(idx==2&&c==2)||(idx==3&&c==1)));return a?`<div class="booking-block ${c==1?'blue':c==2?'purple':''}"><b>${a.name}</b><br>${a.service}<br>${a.time}</div>`:'<div class="slot"></div>'}).join('')}`}).join('')}</div></section><aside style="display:grid;gap:14px"><section class="panel"><h3>Próximos atendimentos</h3>${state.appointments.map(a=>`<div class="list-row"><span><b>${a.time}</b> &nbsp;${a.name}<br><small class="meta">${a.service}</small></span><span class="status">${a.status}</span></div>`).join('')}<button class="button ghost" style="width:100%;margin-top:12px" onclick="go('/admin/agenda')">VER AGENDA</button></section><section class="panel"><h3>Alertas importantes</h3><div class="list-row"><span>⚠ Pomada Modeladora<br><small class="meta">Abaixo do estoque mínimo</small></span><span class="status red">CRÍTICO</span></div><div class="list-row"><span>◌ 3 produtos vencendo<br><small class="meta">Até 7 dias</small></span><span class="status warn">ATENÇÃO</span></div></section></aside></div><div class="admin-grid" style="margin-top:14px"><section class="panel"><h3>Faturamento — últimos 30 dias</h3>${chart()}</section><section class="panel"><h3>Serviços mais realizados</h3>${[['Corte de Cabelo','48'],['Corte + Barba','35'],['Barba','27'],['Visagismo','18']].map(x=>`<div class="list-row"><span>${x[0]}</span><b>${x[1]} atend.</b></div>`).join('')}</section></div>`;return adminShell('/admin',body,'Bom dia, Auto.')}

function generic(path,title,kind){let isStock=kind==='stock';let list=isStock?[['Pomada Modeladora','Pomadas','4 un.','10 un.','R$ 34,90','Crítico'],['Óleo para Barba','Produtos para barba','15 un.','8 un.','R$ 42,00','Baixo'],['Shampoo Anticaspa','Shampoos','8 un.','10 un.','R$ 38,00','Crítico'],['Gel Fixador','Produtos para cabelo','25 un.','8 un.','R$ 29,90','Normal']]:kind==='prof'?pros.map(p=>[p.n,p.e,'42 atendimentos','R$ 4.260,00','★ '+p.r,'Ativo']):services.map(s=>[s[0],s[1],money(s[2]),s[3]+' min','3 profissionais','Ativo']);let headers=isStock?['PRODUTO','CATEGORIA','ATUAL','MÍNIMO','VENDA','STATUS']:kind==='prof'?['PROFISSIONAL','ESPECIALIDADES','ATENDIMENTOS','FATURAMENTO','AVALIAÇÃO','STATUS']:['SERVIÇO','DESCRIÇÃO','PREÇO','DURAÇÃO','HABILITADOS','STATUS'];return adminShell(path,`<div class="toolbar"><input class="search" placeholder="⌕ Buscar ${title.toLowerCase()}"><button class="button" onclick="toast('${title.slice(0,-1)} criado com sucesso')">＋ NOVO ${title.slice(0,-1).toUpperCase()}</button></div><section class="panel"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${list.map(x=>`<tr>${x.map((v,i)=>`<td>${i===0?'<b>'+v+'</b>':i===x.length-1?'<span class="status '+(v==='Crítico'?'red':v==='Baixo'?'warn':'')+'">'+v+'</span>':v}</td>`).join('')}</tr>`).join('')}</tbody></table></section>${isStock?`<section class="panel" style="margin-top:14px"><h3>Movimentações recentes</h3><div class="list-row"><span>Entrada · Óleo para Barba · 10 unidades</span><span class="up">Hoje, 09:32</span></div><div class="list-row"><span>Saída · Pomada Modeladora · 1 unidade</span><span class="meta">Hoje, 08:45</span></div><div class="list-row"><span>Perda · Shampoo Anticaspa · 2 unidades</span><span class="status red">registrada</span></div></section>`:''}`,title, isStock?'Controle produtos, validade e movimentações':'Gerencie informações, disponibilidade e status')}

function settings(){return adminShell('/admin/configuracoes',`<div class="admin-grid"><section class="panel"><h3>Dados da barbearia</h3><div class="form-grid"><label class="field">NOME<input value="Barbearia Bigode Grosso"></label><label class="field">WHATSAPP<input value="(65) 98408-4009"></label><label class="field">CIDADE<input value="Campo Novo do Parecis - MT"></label><label class="field">E-MAIL<input value="contato@bigodegrosso.com"></label></div><h3 style="margin-top:25px">Horários de funcionamento</h3><div class="info-list"><div><span>Segunda a sábado</span><b>08:00 — 20:00</b></div><div><span>Domingo</span><b>Fechado</b></div></div><button class="button" style="margin-top:20px" onclick="toast('Configurações salvas')">SALVAR ALTERAÇÕES</button></section><section class="panel"><h3>Notificações</h3>${['Confirmação de agendamento','Lembrete automático','Estoque baixo','Clientes inativos','Avaliação pós-atendimento'].map((x,i)=>`<div class="list-row"><span>${x}</span><input type="checkbox" ${i<4?'checked':''} style="accent-color:#d4ae61"></div>`).join('')}<h3 style="margin-top:25px">Acessos</h3><div class="list-row"><span>Auto Padrão<br><small class="meta">Proprietário</small></span><span class="status">TOTAL</span></div><div class="list-row"><span>João Oliveira<br><small class="meta">Profissional</small></span><span class="status warn">LIMITADO</span></div></section></div>`,'Configurações','Personalize operação, acessos e comunicação')}
function render(){let p=route(),html=p==='/'?publicHome():p==='/servicos'?servicesPage():p==='/profissionais'?prosPage():p==='/agendamento'?booking():p==='/minha-conta'?account():p==='/admin'?dashboard():p==='/admin/agenda'?agendaPage():p==='/admin/clientes'?clients():p==='/admin/profissionais'?generic(p,'Profissionais','prof'):p==='/admin/servicos'?generic(p,'Serviços','serv'):p==='/admin/estoque'||p==='/admin/produtos'?generic(p,p==='/admin/estoque'?'Estoque':'Produtos','stock'):p==='/admin/financeiro'?finance():p==='/admin/relatorios'?reports():p==='/admin/configuracoes'?settings():p==='/admin/atendimentos'?agendaPage():dashboard();document.getElementById('app').innerHTML=html}function chooseService(i){state.booking={step:1,service:i,pro:null,date:null,time:null};go('/agendamento')}function choosePro(i){state.booking={step:2,service:0,pro:i,date:null,time:null};go('/agendamento')}function selectBook(k,v){state.booking[k]=v;render()}function selectDate(v){state.booking.date=v;render()}function selectTime(v){state.booking.time=v;render()}function bookPrev(){state.booking.step--;render()}function bookNext(){let b=state.booking;if((b.step===1&&b.service===null)||(b.step===2&&b.pro===null)||(b.step===3&&(!b.date||!b.time))){toast('Selecione uma opção para continuar');return}if(b.step===4){let n=document.getElementById('clientName');if(!n.value.trim()){toast('Informe seu nome para continuar');return}}b.step++;render()}function whats(){toast('Abrindo conversa no WhatsApp…')}function toast(msg){let x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}function filterRows(v){document.querySelectorAll('#clientTable tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(v.toLowerCase())?'':'none')}function changeStatus(i){let a=state.appointments[i];a.status=a.status==='Agendado'?'Confirmado':a.status==='Confirmado'?'Em atendimento':'Concluído';toast(`${a.name}: ${a.status}`);render()}function openNewAppointment(){document.getElementById('modal').innerHTML=`<div class="modal-card"><div class="eyebrow">Novo agendamento</div><h2 style="font:500 29px 'Playfair Display';margin:8px 0 20px">Adicionar à agenda</h2><div class="form-grid"><label class="field">CLIENTE<input id="newClient" placeholder="Nome do cliente"></label><label class="field">SERVIÇO<select><option>Corte de Cabelo</option><option>Barba</option><option>Corte + Barba</option></select></label><label class="field">PROFISSIONAL<select><option>João Oliveira</option><option>Carlos Mendes</option></select></label><label class="field">HORÁRIO<input value="16:00"></label></div><div class="booking-controls"><button class="button ghost" onclick="closeModal()">CANCELAR</button><button class="button" onclick="saveAppointment()">CONFIRMAR</button></div></div>`;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function saveAppointment(){let n=document.getElementById('newClient').value||'Novo cliente';state.appointments.push({name:n,service:'Corte de Cabelo',pro:'João Oliveira',time:'16:00',status:'Agendado'});closeModal();toast('Agendamento criado com sucesso');render()}function openClient(i=0){let c=customers[i];document.getElementById('modal').innerHTML=`<div class="modal-card"><div class="pro-top"><div class="avatar">${c?c[0].split(' ').map(x=>x[0]).join(''):'NC'}</div><div><div class="eyebrow">Perfil do cliente</div><h2 style="font:500 28px 'Playfair Display';margin:3px 0">${c?c[0]:'Novo cliente'}</h2></div></div>${c?`<div class="info-list" style="margin-top:22px"><div><span>Telefone</span><b>${c[1]}</b></div><div><span>Total gasto</span><b>${c[4]}</b></div><div><span>Visitas</span><b>${c[5]}</b></div><div><span>Profissional favorito</span><b>${c[6]}</b></div></div><label class="field" style="margin-top:18px">NOTAS DO PROFISSIONAL<textarea>Prefere degradê baixo. Barba mais marcada.</textarea></label>`:`<label class="field">NOME<input placeholder="Nome completo"></label>`}<div class="booking-controls"><button class="button ghost" onclick="closeModal()">FECHAR</button><button class="button" onclick="toast('Perfil salvo');closeModal()">SALVAR</button></div></div>`;document.getElementById('modal').classList.add('show')}window.addEventListener('hashchange',render);render();
</script></body></html>
